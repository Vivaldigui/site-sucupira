media:
  input: public/assets
  output: /assets

content:
  - name: blog
    label: Posts do Blog
    type: collection
    path: src/content/blog
    filename: '{fields.title}.md'
    view:
      fields: [title, publishDate, featured]
      sort: [publishDate, title]
      default:
        sort: publishDate
        order: desc
    fields:
      - name: title
        label: Título
        type: string
        required: true
        description: Título do post — também define o nome do arquivo e a URL.
      - name: description
        label: Descrição (SEO)
        type: text
        required: true
        description: Resumo de 1 a 2 frases que aparece no Google e nos cards do blog.
      - name: publishDate
        label: Data de publicação
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssxxx"
        description: Posts com data futura só entram no ar no dia agendado (build diário ~05:20 BRT).
      - name: author
        label: Autor
        type: string
        default: Priscila Petrucelli
      - name: authorRole
        label: Função do autor
        type: string
        default: Engenheira Agrônoma e cofundadora da Sucupira Naturale
      - name: tags
        label: Tags
        type: select
        description: Lista fechada; para adicionar uma nova tag, edite o arquivo .pages.yml.
        options:
          multiple: true
          values:
            - "Cápsulas de Sucupira"
            - "Chá de Sucupira"
            - "Como Tomar"
            - "Extrato de Sucupira"
            - "Qualidade"
            - "Sucupira"
            - "Sucupira Branca"
      - name: featured
        label: Post em destaque
        type: boolean
        default: false
      - name: ads
        label: Exibir anúncios da loja
        type: boolean
        default: true
        description: Card da loja no meio e no fim do texto, e link na primeira menção à marca. Desmarque só se o artigo pedir outro tratamento; fica o bloco simples do produto.
      - name: ogImage
        label: Imagem de capa (opcional)
        type: image
        description: Se ficar vazio, o post usa a capa padrão do blog. Nunca usar o banner comercial de produto como capa.
      - name: body
        label: Conteúdo
        type: rich-text
